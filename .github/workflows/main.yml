name: Add External EXE to Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  add-exe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (with full history and fetch depth)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main   # مستقیماً شاخه main را checkout کن

      - name: Download EXE
        env:
          DOWNLOAD_URL: "https://release-assets.githubusercontent.com/github-production-release-asset/1221068421/027fb241-c51d-44f5-9812-6c848ea9c2cb?sp=r&sv=2018-11-09&sr=b&spr=https&se=2026-05-06T14%3A10%3A59Z&rscd=attachment%3B+filename%3DNova.App.V1.zip&rsct=application%2Foctet-stream&skoid=96c2d410-5711-43a1-aedd-ab1947aa7ab0&sktid=398a6654-997b-47e9-b12b-9515b896b4de&skt=2026-05-06T13%3A10%3A51Z&ske=2026-05-06T14%3A10%3A59Z&sks=b&skv=2018-11-09&sig=yLvvRVoNQXe3NCxvp%2FxtIFGuvDku6JCUWiKCJHgyvxU%3D&jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmVsZWFzZS1hc3NldHMuZ2l0aHVidXNlcmNvbnRlbnQuY29tIiwia2V5Ijoia2V5MSIsImV4cCI6MTc3ODA3NTg5NiwibmJmIjoxNzc4MDc0MDk2LCJwYXRoIjoicmVsZWFzZWFzc2V0cHJvZHVjdGlvbi5ibG9iLmNvcmUud2luZG93cy5uZXQifQ.plkU8JsU4Yaa86fwEooiTda1QFnj9AmnsH88xZb8CZw&response-content-disposition=attachment%3B%20filename%3DNova.App.V1.zip&response-content-type=application%2Foctet-stream"
        run: |
          curl -L -o application.exe "$DOWNLOAD_URL"

      - name: Commit and push EXE to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add application.exe
          git commit -m "Add EXE file automatically from workflow" || echo "No changes to commit"
          git push origin main
